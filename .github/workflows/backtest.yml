name: Weekly backtest

on:
  schedule:
    - cron: "37 5 * * 1"     # Monday morning, after the weekend's results
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/backtest_matches.csv data/raw
          git diff --cached --quiet || git commit -m "Weekly backtest $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
