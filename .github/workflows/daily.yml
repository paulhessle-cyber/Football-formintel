name: Daily predictions

on:
  schedule:
    # GitHub starts scheduled jobs on this repo 7-8 hours late, so there are
    # four slots: whichever way the delay goes, the site is fresh by morning
    # and again around lunchtime (UK). Extra runs are harmless.
    - cron: "12 22 * * *"
    - cron: "42 2 * * *"
    - cron: "12 6 * * *"
    - cron: "42 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # re-predict when news tags change, the news task reports a run, or a refresh is requested
    paths: ["data/news_events.csv", "data/news_runs.csv", "data/refresh.txt"]

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python predict.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data logs data/raw $(ls -d data/betfair 2>/dev/null)
          git diff --cached --quiet || git commit -m "Daily predictions $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -X theirs
          git push
