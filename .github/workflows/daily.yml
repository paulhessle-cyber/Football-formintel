name: Daily predictions

on:
  schedule:
    - cron: "12 6 * * *"     # 07:12 UK summer / 06:12 winter
    - cron: "42 10 * * *"    # late-morning refresh for updated odds and news
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python predict.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data logs data/raw
          git diff --cached --quiet || git commit -m "Daily predictions $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
