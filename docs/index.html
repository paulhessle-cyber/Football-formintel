<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lower League Predictor</title>
<style>
:root{
  --bg:#f4f2ee;--card:#fff;--ink:#1b1d1f;--muted:#6b6f75;--line:#e3e0da;
  --home:#2f6f4f;--draw:#9a8f7a;--away:#3a5a8c;--value:#c2410c;--value-bg:#fff1e8;
  --news:#7c3aed;--chip:#ebe8e2;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141516;--card:#1e2022;--ink:#ecebe8;--muted:#9a9ea4;--line:#2d3033;
  --home:#4fae7f;--draw:#a89f8c;--away:#6d93d1;--value:#fb923c;--value-bg:#3a2516;
  --news:#a78bfa;--chip:#2a2c2f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav button,.chip{white-space:nowrap;flex-shrink:0;border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px}
nav button.on,.chip.on{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
main{padding:8px 16px 40px;max-width:720px;margin:0 auto}
.day{font-size:13px;font-weight:600;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.val{border-color:var(--value)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.teams{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 8px;font-weight:600;font-size:16px;gap:8px}
.teams .xg{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:12px;font-weight:600;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;min-width:28px}
.grid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:3px 10px;font-size:12.5px;margin-top:10px;font-variant-numeric:tabular-nums}
.grid .h{color:var(--muted)}
.grid .pos{color:var(--value);font-weight:700}
.extra{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.extra b{color:var(--ink);font-weight:600}
.tag{display:inline-block;background:var(--value-bg);color:var(--value);border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700;margin:8px 4px 0 0}
.news{margin-top:8px;font-size:12.5px;color:var(--news)}
.warn{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}
.stat{display:grid;grid-template-columns:1fr auto auto auto auto;gap:4px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.stat .h{color:var(--muted);font-size:12px}
.good{color:var(--home);font-weight:600}.bad{color:var(--value);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.pl .m{color:var(--muted);font-size:12px}
.pl .r{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:4px}
.b-open{background:var(--chip);color:var(--muted)}.b-win{background:#e3f1e9;color:var(--home)}.b-loss{background:var(--value-bg);color:var(--value)}
@media (prefers-color-scheme:dark){.b-win{background:#16301f}}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.big div{background:var(--chip);border-radius:10px;padding:8px 10px}
.big b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.big span{font-size:11.5px;color:var(--muted)}
p.note{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Lower League Predictor</h1>
  <div class="sub" id="sub">Loading…</div>
  <nav>
    <button data-tab="fixtures" class="on">Fixtures</button>
    <button data-tab="ratings">Ratings</button>
    <button data-tab="paper">Paper bets</button>
    <button data-tab="backtest">Track record</button>
  </nav>
</header>
<div class="filters" id="filters"></div>
<main id="main"><div class="empty">Loading…</div></main>

<script>
const LEAGUES = {E2:"League One",E3:"League Two",EC:"National League"};
let P = null, B = null, PB = null, tab = "fixtures", league = "all", valueOnly = false;

const pct = x => x == null ? "–" : Math.round(x*100) + "%";
const odd = x => x == null ? "–" : x.toFixed(2);
const sgn = x => x == null ? "–" : (x>0?"+":"") + (x*100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const line = l => l == null ? "–" : (l>0?"+":"") + l;

async function load(){
  try { P = await (await fetch("data/predictions.json",{cache:"no-store"})).json(); } catch(e) {}
  try { B = await (await fetch("data/backtest.json",{cache:"no-store"})).json(); } catch(e) {}
  try { PB = await (await fetch("data/paper.json",{cache:"no-store"})).json(); } catch(e) {}
  document.getElementById("sub").textContent = P
    ? `v${P.version} · updated ${new Date(P.generated).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "No predictions yet — run the daily workflow";
  render();
}

function filters(){
  const el = document.getElementById("filters");
  if (tab === "backtest" || tab === "paper") { el.innerHTML = ""; return; }
  const chips = [["all","All"], ...Object.entries(LEAGUES)];
  el.innerHTML = chips.map(([k,v]) => `<button class="chip ${league===k?"on":""}" data-lg="${k}">${v}</button>`).join("")
    + (tab==="fixtures" ? `<button class="chip ${valueOnly?"on":""}" data-val="1">Value only</button>` : "");
}

function card(f){
  const val = f.value.length > 0;
  const e = f.edge, o = f.odds, p = f.prob;
  const cls = x => x != null && x >= P.min_edge ? "pos" : "";
  const mk = f.prob_market;
  let html = `<div class="card ${val?"val":""}">
    <div class="meta"><span>${esc(f.league)}</span><span>${esc(f.time)}</span></div>
    <div class="teams"><span>${esc(f.home)} <span class="xg">${f.xg.home} xG</span></span>
      <span style="text-align:right"><span class="xg">${f.xg.away} xG</span> ${esc(f.away)}</span></div>
    <div class="bar">
      <div style="width:${p.h*100}%;background:var(--home)">${pct(p.h)}</div>
      <div style="width:${p.d*100}%;background:var(--draw)">${pct(p.d)}</div>
      <div style="width:${p.a*100}%;background:var(--away)">${pct(p.a)}</div>
    </div>
    <div class="grid">
      <span class="h"></span><span class="h">Home</span><span class="h">Draw</span><span class="h">Away</span>
      <span class="h">Fair</span><span>${odd(f.fair.h)}</span><span>${odd(f.fair.d)}</span><span>${odd(f.fair.a)}</span>
      <span class="h">Best</span><span>${odd(o.h)}</span><span>${odd(o.d)}</span><span>${odd(o.a)}</span>
      <span class="h">Edge</span><span class="${cls(e.h)}">${sgn(e.h)}</span><span class="${cls(e.d)}">${sgn(e.d)}</span><span class="${cls(e.a)}">${sgn(e.a)}</span>
      <span class="h">Model</span><span>${pct(f.prob_model.h)}</span><span>${pct(f.prob_model.d)}</span><span>${pct(f.prob_model.a)}</span>
      ${mk ? `<span class="h">Market</span><span>${pct(mk.h)}</span><span>${pct(mk.d)}</span><span>${pct(mk.a)}</span>` : ""}
    </div>
    <div class="extra">
      <span>O2.5 <b>${pct(p.o25)}</b> (fair ${odd(f.fair.o25)}, best ${odd(o.o25)}<span class="${cls(e.o25)}"> ${sgn(e.o25)}</span>)</span>
      <span>AH fair <b>${line(f.ah_fair.line)}</b> @ ${odd(f.ah_fair.home)}/${odd(f.ah_fair.away)}</span>
      ${f.ah_market ? `<span>AH mkt <b>${line(f.ah_market.line)}</b> @ ${odd(f.ah_market.home_odds)}/${odd(f.ah_market.away_odds)}</span>` : ""}
    </div>`;
  const names = {h:"Home",d:"Draw",a:"Away",o25:"Over 2.5",u25:"Under 2.5",ah_home:"AH Home",ah_away:"AH Away"};
  if (val) html += f.value.map(v => `<span class="tag">Value: ${names[v]||v}</span>`).join("");
  if (f.news.length) html += `<div class="news">📰 ${f.news.map(esc).join("<br>📰 ")}</div>`;
  if (f.no_market) html += `<div class="warn">No bookmaker prices yet — showing the team model alone.</div>`;
  if (f.unknown_team.length) html += `<div class="warn">No history for ${f.unknown_team.map(esc).join(", ")} — rated as a weak side in this league.</div>`;
  return html + `</div>`;
}

function fixtures(){
  if (!P || !P.fixtures.length) return `<div class="empty">${P && P.error ? esc(P.error) : "No upcoming fixtures."}</div>`;
  let fx = P.fixtures.filter(f => (league==="all"||f.div===league) && (!valueOnly || f.value.length));
  if (!fx.length) return `<div class="empty">Nothing matches this filter.</div>`;
  let out = "", day = "";
  for (const f of fx) {
    if (f.date !== day) {
      day = f.date;
      out += `<div class="day">${new Date(day+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}</div>`;
    }
    out += card(f);
  }
  return out;
}

function ratings(){
  if (!P) return `<div class="empty">No ratings yet.</div>`;
  const rows = P.ratings.filter(r => league==="all" || r.div===league);
  return `<p class="note">Team strength from the baseline model (time-weighted, all three leagues on one scale). Positive = better than average.</p>
  <table><tr><th>#</th><th>Team</th><th>Lg</th><th class="n">Att</th><th class="n">Def</th><th class="n">Overall</th></tr>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.team)}</td><td>${r.div}</td><td class="n">${r.attack.toFixed(2)}</td><td class="n">${r.defence.toFixed(2)}</td><td class="n"><b>${r.overall.toFixed(2)}</b></td></tr>`).join("")}</table>`;
}

function statBlock(title, s){
  const v = x => x == null ? "–" : x.toFixed(4);
  const row = (label, m, o, b, c) => `<span>${label}</span><span>${v(m)}</span><span>${v(o)}</span><span><b>${v(b)}</b></span><span>${v(c)}</span>`;
  const vb = s.value_bets || {bets:0};
  return `<div class="card"><div class="teams" style="margin-top:0">${esc(title)} <span class="xg">${s.matches} matches</span></div>
   <div class="stat">
    <span class="h">Log loss</span><span class="h">Model</span><span class="h">Market</span><span class="h">Blend</span><span class="h">Close</span>
    ${row("1X2", s.logloss_1x2_model, s.logloss_1x2_open, s.logloss_1x2_blend, s.logloss_1x2_close)}
    ${row("O/U 2.5", s.logloss_ou25_model, s.logloss_ou25_open, s.logloss_ou25_blend, s.logloss_ou25_close)}
   </div>
   <div class="extra" style="margin-top:10px">
    <span>Value bets <b>${vb.bets}</b></span>
    ${vb.bets ? `<span>ROI <b class="${vb.roi>0?"good":"bad"}">${sgn(vb.roi)}</b></span>
    <span>Avg CLV <b class="${vb.avg_clv>0?"good":"bad"}">${sgn(vb.avg_clv)}</b></span>
    <span>Beat close <b>${pct(vb.beat_close_pct)}</b></span>
    <span>Avg odds <b>${vb.avg_odds}</b></span>` : ""}
   </div></div>`;
}

function backtest(){
  if (!B) return `<div class="empty">No backtest yet — run the backtest workflow.</div>`;
  return `<p class="note">Walk-forward test ${B.from} → ${B.to}: refitted weekly, each match predicted using only earlier results.
   Lower log loss is better. <b>Market</b> = bookmakers' pre-match price, <b>Blend</b> = what this site shows,
   <b>Close</b> = Betfair Exchange closing price (the sharpest benchmark).
   Value bets = blended edge ≥ ${Math.round(B.min_edge*100)}% at the best pre-match price.
   Closing-line value (CLV) is the reliable sign of a real edge; ROI over a few hundred bets is mostly luck.</p>`
   + (B.weights ? `<div class="card"><div class="teams" style="margin-top:0">Model weight</div>
   <div class="extra" style="margin-top:0"><span>1X2 <b>${pct(B.weights.w_1x2)}</b></span><span>Over/Under <b>${pct(B.weights.w_ou25)}</b></span></div>
   <p class="note" style="margin-bottom:0">How much the team model is trusted over the market, learned from past results.
   0% means it currently adds nothing the bookies don't already know. New layers (xG, news, lineups) raise this only if they improve predictions.</p></div>` : "")
   + statBlock("All leagues", B.overall)
   + Object.values(B.leagues).map(l => statBlock(l.name, l)).join("");
}

function curveSvg(c){
  if (!c || c.length < 2) return "";
  const W=340,H=70,min=Math.min(0,...c),max=Math.max(0,...c),rng=(max-min)||1;
  const x=i=>i/(c.length-1)*W, y=v=>H-(v-min)/rng*H;
  const pts=c.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const col=c[c.length-1]>=0?"var(--home)":"var(--value)";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:6px" aria-label="Running profit">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/></svg>`;
}

function paperStats(title, s){
  if (!s || !s.bets) return "";
  return `<div class="pl"><span><b>${esc(title)}</b> <span class="m">${s.settled} settled · ${s.open} open</span></span>
    <span class="r">${s.settled ? `<b class="${s.profit_best>=0?"good":"bad"}">${s.profit_best>0?"+":""}${s.profit_best}u</b>` : "–"}</span>
    <span class="m">${s.settled ? `ROI ${sgn(s.roi_best)} · CLV ${sgn(s.avg_clv)} · beat close ${pct(s.beat_close_pct)}` : "waiting for results"}</span><span></span></div>`;
}

function paperTab(){
  if (!PB || !PB.overall || !PB.overall.bets) return `<p class="note">Every bet the site flags as value is recorded here at 1 unit, the first time it's flagged, then settled automatically when the result comes in. Nothing recorded yet — bets appear once the daily run flags one.</p>`;
  const o = PB.overall, t = PB.by_type || {};
  let h = `<p class="note">Every value bet the site flags, recorded at 1 unit the first time it's flagged and settled automatically. <b>CLV</b> (did we beat the closing price?) is the number to judge by — a few hundred bets are needed before profit means much.</p>
  <div class="card"><div class="big">
    <div><b class="${(o.profit_best||0)>=0?"good":"bad"}">${o.settled ? (o.profit_best>0?"+":"")+o.profit_best+"u" : "–"}</b><span>Profit (best price)</span></div>
    <div><b class="${(o.avg_clv||0)>0?"good":"bad"}">${o.settled ? sgn(o.avg_clv) : "–"}</b><span>Avg CLV</span></div>
    <div><b>${o.settled ? pct(o.beat_close_pct) : "–"}</b><span>Beat close</span></div>
  </div>
  <div class="extra" style="margin-top:0"><span>Bets <b>${o.bets}</b></span><span>Settled <b>${o.settled}</b></span>
   ${o.settled ? `<span>ROI best <b>${sgn(o.roi_best)}</b></span><span>ROI avg price <b>${sgn(o.roi_avg)}</b></span><span>Won <b>${pct(o.win_pct)}</b></span><span>Avg odds <b>${o.avg_odds}</b></span>` : ""}</div>
  ${curveSvg(PB.curve)}</div>
  <div class="card">${paperStats("With news tag", t.news)}${paperStats("No news", t.no_news)}${paperStats("Win/draw/win", t["1x2"])}${paperStats("Over/Under", t.ou25)}${paperStats("Asian handicap", t.ah)}</div>
  <div class="day">Bets</div><div class="card">`;
  for (const b of PB.bets) {
    const st = b.status==="open" ? `<span class="badge b-open">open</span>`
      : b.status==="void" ? `<span class="badge b-open">void</span>`
      : `<span class="badge ${b.profit_best>0?"b-win":b.profit_best<0?"b-loss":"b-open"}">${b.result}</span>`;
    const ln = b.line==null ? null : (b.label==="AH Away" ? -b.line : b.line);
    const line = ln!=null && b.label.startsWith("AH") ? " "+(ln>0?"+":"")+ln : "";
    h += `<div class="pl"><span><b>${esc(b.label)}${line}</b> @ ${odd(b.odds_best)}${b.news?" 📰":""} ${st}</span>
      <span class="r">${b.status==="settled" ? `<b class="${b.profit_best>=0?"good":"bad"}">${b.profit_best>0?"+":""}${b.profit_best.toFixed(2)}</b>` : ""}</span>
      <span class="m">${esc(b.home)} v ${esc(b.away)} · ${b.date.slice(8)}/${b.date.slice(5,7)} · edge ${sgn(b.edge)}${b.clv!=null?` · CLV ${sgn(b.clv)}`:""}</span><span></span></div>`;
  }
  return h + `</div>`;
}

function render(){
  filters();
  document.getElementById("main").innerHTML =
    tab==="fixtures" ? fixtures() : tab==="ratings" ? ratings() : tab==="paper" ? paperTab() : backtest();
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x===b));
  render(); window.scrollTo(0,0);
});
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lg) league = b.dataset.lg;
  if (b.dataset.val) valueOnly = !valueOnly;
  render();
});
load();
</script>
</body>
</html>
